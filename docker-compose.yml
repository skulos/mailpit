version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mailpit-postgres-test
    environment:
      POSTGRES_DB: mailpit
      POSTGRES_USER: mailpit
      POSTGRES_PASSWORD: mailpit123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailpit -d mailpit"]
      interval: 5s
      timeout: 5s
      retries: 5

